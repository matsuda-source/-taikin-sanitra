<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>退勤とサニトラ</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;margin:0;background:#f5f7fb;color:#111827}
.app{max-width:720px;margin:auto;padding:16px 14px 90px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:12px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{background:#fafafa;border:1px solid #e5e7eb;border-radius:14px;padding:12px}
.muted{color:#6b7280;font-size:13px}
.big{font-size:28px;font-weight:800}.mid{font-size:21px;font-weight:750}
label{display:block;font-size:13px;color:#6b7280;margin:10px 0 6px}
input,select,button,textarea{width:100%;font:inherit;border:1px solid #d1d5db;border-radius:12px;padding:11px 12px;background:#fff;box-sizing:border-box}
button{font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff;border-color:#111827}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.bar{height:13px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar>div{height:100%;background:#111827}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#f3f4f6;font-size:12px;margin:2px 4px 2px 0}
.page{display:none}.page.active{display:block}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e5e7eb;display:grid;grid-template-columns:repeat(5,1fr);padding:7px}
.tabs button{border:0;background:transparent;padding:8px 2px;font-size:11px}.tabs button.active{font-weight:800}
.history-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e5e7eb;padding:9px 0}.right{text-align:right}
textarea{min-height:140px}
@media(max-width:520px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>退勤とサニトラ 🚚</h1><div class="muted" id="todayText"></div>

<section id="home" class="page active">
<div class="card">
<h2>今日の勤務</h2>
<div class="row"><div><label>出勤</label><input id="start" type="time"></div><div><label>退勤</label><input id="end" type="time"></div></div>
<div class="quick"><button onclick="quickEnd('17:00')">17:00</button><button onclick="quickEnd('18:00')">18:00</button><button onclick="quickEnd('19:00')">19:00</button><button onclick="quickEnd('20:00')">20:00</button></div>
<div class="stat" style="margin-top:14px"><div class="muted">今日の残業プレビュー</div><div class="mid" id="todayOtPreview"></div><div class="muted" id="todayPayPreview"></div></div>
<button class="primary" style="margin-top:12px" onclick="addWork()">この勤務を登録</button>
<div class="muted" style="margin-top:8px">※ 17:00〜17:15は休憩として残業時間に含めません。</div>
</div>
<div class="card"><h2>今月</h2><div class="grid3"><div class="stat"><div class="muted">残業</div><div class="mid" id="monthOT"></div></div><div class="stat"><div class="muted">残業代</div><div class="mid" id="monthPay"></div></div><div class="stat"><div class="muted">45hまで</div><div class="mid" id="otRemain"></div></div></div><div class="bar" style="margin-top:12px"><div id="otBar"></div></div><div class="muted" id="otStatus" style="margin-top:7px"></div></div>
<div class="card"><h2>サニトラ資金</h2><div class="big" id="savingNow"></div><div class="muted" id="goalText"></div><div class="bar" style="margin:12px 0 7px"><div id="savingBar"></div></div><div id="savingStatus"></div><div class="stat" style="margin-top:12px"><div class="muted">このペースなら</div><div class="mid" id="goalEta"></div></div></div>
</section>

<section id="work" class="page"><div class="card"><h2>勤務履歴</h2><div id="workList"></div></div></section>

<section id="saving" class="page">
<div class="card"><h2>貯金を追加</h2><label>金額</label><input id="saveAmount" type="number" inputmode="numeric" placeholder="50000"><label>種類</label><select id="saveType"><option>毎月貯金</option><option>ボーナス</option><option>臨時収入</option><option>その他</option><option>出金</option></select><label>メモ</label><input id="saveMemo" placeholder="任意"><button class="primary" style="margin-top:12px" onclick="addSaving()">追加</button></div>
<div class="card"><h2>貯金履歴</h2><div id="saveList"></div></div>
</section>

<section id="sim" class="page"><div class="card"><h2>サニトラ購入シミュレーター</h2><label>現在の貯金</label><input id="simNow" type="number"><label>毎月の積立</label><input id="simMonthly" type="number"><label>追加の臨時収入</label><input id="simExtra" type="number" value="0"><label>目標金額</label><input id="simGoal" type="number"><button class="primary" style="margin-top:12px" onclick="runSim()">計算</button><div class="stat" style="margin-top:14px"><div class="muted">結果</div><div class="mid" id="simResult"></div><div class="muted" id="simDetail"></div></div></div></section>

<section id="settings" class="page">
<div class="card"><h2>設定</h2><div class="row"><div><label>標準出勤</label><input id="setStart" type="time"></div><div><label>標準退勤</label><input id="setEnd" type="time"></div></div><label>残業上限（時間/月）</label><input id="setLimit" type="number"><label>残業単価（円/時間）</label><input id="setHourly" type="number"><label>毎月の車貯金（円）</label><input id="setMonthly" type="number"><label>車の目標金額（円）</label><input id="setCar" type="number"><label>購入時に残したい予備資金（円）</label><input id="setExtra" type="number"><label>初期貯金額（円）</label><input id="setInitial" type="number"><button class="primary" style="margin-top:12px" onclick="saveSettings()">設定を保存</button></div>
<div class="card"><h2>バックアップ</h2><button onclick="exportBackup()">バックアップを書き出す</button><label>バックアップJSONを貼り付け</label><textarea id="backupText"></textarea><button onclick="importBackup()">復元する</button></div>
</section>
</div>

<nav class="tabs">
<button class="active" onclick="showPage('home',this)">🏠<br>ホーム</button>
<button onclick="showPage('work',this)">🕒<br>勤務</button>
<button onclick="showPage('saving',this)">💰<br>貯金</button>
<button onclick="showPage('sim',this)">🚚<br>シミュ</button>
<button onclick="showPage('settings',this)">⚙️<br>設定</button>
</nav>

<script>
const KEY="taikinSanitraV4";
const defaults={settings:{start:"08:30",end:"17:00",limit:45,hourly:2679,monthly:50000,car:1500000,extra:300000,initial:0},work:[],savings:[]};
const clone=x=>JSON.parse(JSON.stringify(x));
function loadDb(){try{const raw=localStorage.getItem(KEY);if(!raw)return clone(defaults);const old=JSON.parse(raw);return{settings:{...defaults.settings,...(old.settings||{})},work:Array.isArray(old.work)?old.work:[],savings:Array.isArray(old.savings)?old.savings:[]}}catch(e){return clone(defaults)}}
let db=loadDb();
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function yen(v){return Math.round(Number(v)||0).toLocaleString("ja-JP")+"円"}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function minFromTime(t){if(!t||!t.includes(":"))return 0;const [h,m]=t.split(":").map(Number);return h*60+m}
function formatMin(m){m=Math.max(0,Math.round(Number(m)||0));return `${Math.floor(m/60)}時間${String(m%60).padStart(2,"0")}分`}
function calcOT(start,end){const s=minFromTime(start),e=minFromTime(end),standardEnd=minFromTime(db.settings.end||"17:00");if(e<=s||e<=standardEnd)return 0;const breakEnd=standardEnd+15;if(e<=breakEnd)return 0;return e-breakEnd}
function getMonthOT(){const d=new Date(),p=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-`;return db.work.filter(x=>String(x.date||"").startsWith(p)).reduce((a,x)=>a+(Number(x.ot)||0),0)}
function currentSaving(){return (Number(db.settings.initial)||0)+db.savings.reduce((a,x)=>a+(Number(x.amount)||0),0)}
function goal(){return (Number(db.settings.car)||0)+(Number(db.settings.extra)||0)}
function futureDate(months){const d=new Date();d.setMonth(d.getMonth()+months);return `${d.getFullYear()}年${d.getMonth()+1}月`}
function monthsTo(target,now=currentSaving(),monthly=Number(db.settings.monthly)||0){if(now>=target)return 0;if(monthly<=0)return null;return Math.ceil((target-now)/monthly)}
function quickEnd(v){document.getElementById("end").value=v;previewToday()}
function previewToday(){const ot=calcOT(start.value,end.value);todayOtPreview.textContent=formatMin(ot);todayPayPreview.textContent=`残業代 約${yen(ot/60*(Number(db.settings.hourly)||0))}`}
function addWork(){const rec={date:today(),start:start.value,end:end.value,ot:calcOT(start.value,end.value)};const i=db.work.findIndex(x=>x.date===rec.date);if(i>=0)db.work[i]=rec;else db.work.push(rec);db.work.sort((a,b)=>String(b.date).localeCompare(String(a.date)));persist();render()}
function addSaving(){const raw=Number(saveAmount.value)||0,type=saveType.value,amount=type==="出金"?-Math.abs(raw):Math.abs(raw);if(!amount)return;db.savings.unshift({id:Date.now(),date:today(),amount,type,memo:saveMemo.value.trim()});saveAmount.value="";saveMemo.value="";persist();render()}
function deleteWork(date){if(confirm(`${date} の勤務記録を削除しますか？`)){db.work=db.work.filter(x=>x.date!==date);persist();render()}}
function deleteSaving(id){if(confirm("この貯金記録を削除しますか？")){db.savings=db.savings.filter(x=>x.id!==id);persist();render()}}
function saveSettings(){db.settings={...db.settings,start:setStart.value||"08:30",end:setEnd.value||"17:00",limit:Number(setLimit.value)||45,hourly:Number(setHourly.value)||0,monthly:Number(setMonthly.value)||0,car:Number(setCar.value)||0,extra:Number(setExtra.value)||0,initial:Number(setInitial.value)||0};persist();syncInputs();render();alert("保存しました")}
function runSim(){const n=Number(simNow.value)||0,m=Number(simMonthly.value)||0,e=Number(simExtra.value)||0,t=Number(simGoal.value)||0,b=n+e;if(b>=t){simResult.textContent="今すぐ購入圏内";simDetail.textContent="";return}if(m<=0){simResult.textContent="毎月の積立額を設定してください";simDetail.textContent="";return}const months=Math.ceil((t-b)/m);simResult.textContent=`${futureDate(months)}ごろ`;simDetail.textContent=`あと${months}ヶ月 / 残り ${yen(t-b)}`}
function syncInputs(){const st=db.settings,rec=db.work.find(x=>x.date===today());start.value=rec?.start||st.start;end.value=rec?.end||st.end;setStart.value=st.start;setEnd.value=st.end;setLimit.value=st.limit;setHourly.value=st.hourly;setMonthly.value=st.monthly;setCar.value=st.car;setExtra.value=st.extra;setInitial.value=st.initial;simNow.value=currentSaving();simMonthly.value=st.monthly;simGoal.value=goal();previewToday()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){todayText.textContent=new Intl.DateTimeFormat("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"}).format(new Date());const mot=getMonthOT(),limit=(Number(db.settings.limit)||45)*60,remain=Math.max(0,limit-mot);document.getElementById("monthOT").textContent=formatMin(mot);monthPay.textContent=yen(mot/60*(Number(db.settings.hourly)||0));otRemain.textContent=formatMin(remain);otBar.style.width=(limit?Math.min(100,mot/limit*100):0)+"%";let state="通常";if(mot>=45*60)state="⚠️ 45時間以上";else if(mot>=40*60)state="かなり注意";else if(mot>=30*60)state="注意";otStatus.textContent=`${formatMin(mot)} / ${db.settings.limit}時間　${state}`;const s=currentSaving(),g=goal(),rate=g?Math.min(100,s/g*100):0;savingNow.textContent=yen(s);goalText.textContent=`目標 ${yen(g)}（車 ${yen(db.settings.car)} + 予備 ${yen(db.settings.extra)}）`;savingBar.style.width=rate+"%";savingStatus.innerHTML=`<span class="badge">${rate.toFixed(1)}%</span>`+(s>=g?`<span class="badge">購入圏内 🎉</span>`:`<span class="badge">あと ${yen(g-s)}</span>`);const m=monthsTo(g);goalEta.textContent=m===0?"今すぐ購入圏内":m===null?"毎月の積立額を設定してください":`${futureDate(m)}ごろ（あと${m}ヶ月）`;workList.innerHTML=db.work.length?db.work.map(x=>`<div class="history-item"><div><strong>${x.date}</strong><div class="muted">${x.start} → ${x.end}</div></div><div class="right"><strong>${formatMin(x.ot)}</strong><div class="muted">${yen((Number(x.ot)||0)/60*(Number(db.settings.hourly)||0))}</div><button onclick="deleteWork('${x.date}')">削除</button></div></div>`).join(""):`<div class="muted">まだ勤務記録がありません</div>`;saveList.innerHTML=db.savings.length?db.savings.map(x=>`<div class="history-item"><div><strong>${x.type}</strong><div class="muted">${x.date}${x.memo?` ・ ${escapeHtml(x.memo)}`:""}</div></div><div class="right"><strong>${x.amount>=0?"+":""}${yen(x.amount)}</strong><br><button onclick="deleteSaving(${Number(x.id)})">削除</button></div></div>`).join(""):`<div class="muted">まだ貯金記録がありません</div>`;previewToday()}
function showPage(id,btn){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===id));document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn?.classList.add("active");if(id==="sim"){simNow.value=currentSaving();simMonthly.value=db.settings.monthly;simGoal.value=goal()}}
function exportBackup(){const text=JSON.stringify(db,null,2);backupText.value=text;navigator.clipboard?.writeText(text).catch(()=>{});alert("バックアップJSONを表示しました")}
function importBackup(){try{const obj=JSON.parse(backupText.value);db={settings:{...defaults.settings,...(obj.settings||{})},work:Array.isArray(obj.work)?obj.work:[],savings:Array.isArray(obj.savings)?obj.savings:[]};persist();syncInputs();render();alert("復元しました")}catch(e){alert("バックアップJSONを読み込めませんでした")}}
start.addEventListener("change",previewToday);end.addEventListener("change",previewToday);syncInputs();render();runSim();
</script>
</body>
</html>
